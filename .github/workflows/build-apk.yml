name: Build InvestPro APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build Web App
        run: |
          # Crée un dossier www si nécessaire pour éviter les erreurs Capacitor
          mkdir -p www
          cp index.html www/

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Capacitor Android Sync
        run: |
          npx cap init InvestPro com.doanyon.investpro --web-dir .
          npx cap add android
          npx cap copy android

     - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InvestPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk