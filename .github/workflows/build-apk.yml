name: Build InvestPro APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permet de lancer manuellement depuis GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3. Installer Java (remplace Android Studio)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Installer les dépendances npm (Capacitor)
      - name: Install dependencies
        run: npm install

      # 5. Synchroniser le projet web dans Android
      - name: Sync Capacitor
        run: npx cap sync android

      # 6. Compiler l'APK debug
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 7. Publier l'APK pour téléchargement
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InvestPro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30